<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lingo World</title>
<meta name="description" content="Speaking-first app to learn Spanish, French, Taiwan Mandarin, Cantonese, Japanese and Korean, with cute characters.">
<meta name="theme-color" content="#fffdf9">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bubbles" aria-hidden="true"></div>
<header class="topbar">
  <a href="#/profile" class="avatar" id="avatar" title="Your profile"></a>
  <a href="#/" class="brand">Lingo World</a>
  <div class="stats">
    <span class="pill hide-sm" title="XP">🏆 <b id="xp">0</b></span>
    <a class="pill" href="#/streak" title="Day streak: tap for your calendar">🔥 <b id="streak">0</b></a>
    <a class="pill" href="#/shop" title="Blingos: tap for the shop"><span class="coin">B</span> <b id="bl">0</b></a>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<div id="toast" class="toast" role="status"></div>
<nav class="tabbar" id="tabbar" aria-label="Main">
  <a href="#/" data-tab="home" aria-label="Home"><span class="ti">🏠</span><span class="tl">Home</span></a>
  <a href="#/practice" data-tab="practice" aria-label="Practice"><span class="ti">🎤</span><span class="tl">Practice</span></a>
  <a href="#/es/practice/review" data-tab="review" aria-label="Review"><span class="ti">🔁</span><span class="tl">Review</span></a>
  <a href="#/me" data-tab="char" aria-label="Character and shop"><span class="ti" id="tabchar"></span><span class="tl">Closet</span></a>
  <a href="#/profile" data-tab="profile" aria-label="Profile"><span class="ti">👤</span><span class="tl">Profile</span></a>
</nav>
<script src="characters.js"></script>
<script src="app.js"></script>
</body>
</html>
